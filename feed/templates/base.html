{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chirp{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-csrf="{{ csrf_token }}">
<header class="nav">
  <a class="brand" href="{% url 'feed' %}">🐦 Chirp</a>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'feed' %}">Home</a>
      <a href="{% url 'explore' %}">Explore</a>
      <a href="{% url 'profile' user.username %}">@{{ user.username }}</a>
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
